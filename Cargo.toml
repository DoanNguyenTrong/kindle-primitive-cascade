[workspace]
resolver = "2"
members = ["crates/cascade-core", "crates/cascade-render", "crates/cascade-kindle", "crates/cascade-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
cascade-core = { path = "crates/cascade-core" }
cascade-render = { path = "crates/cascade-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
